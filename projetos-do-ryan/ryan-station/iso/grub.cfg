set timeout=4
set default=0
insmod all_video
insmod gfxterm
set menu_color_normal=white/black
set menu_color_highlight=black/light-cyan
menuentry "RYAN STATION" {
  linux /casper/vmlinuz boot=casper quiet splash noprompt fsck.mode=skip loglevel=3 ---
  initrd /casper/initrd
}
menuentry "RYAN STATION (modo de video seguro)" {
  linux /casper/vmlinuz boot=casper nomodeset quiet noprompt fsck.mode=skip ---
  initrd /casper/initrd
}
