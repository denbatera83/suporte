<title>Fábrica de Vídeos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap">
<style>
  /* Layout: estúdio de cinema — pedido à esquerda, tela de cinema à direita; no celular tudo empilha. */
  :root {
    --bg: #12131a; --painel: #1b1d27; --painel2: #232633; --linha: #343849; --texto: #eef0f6; --suave: #a3a8bb;
    --claquete: #ffc53d; --claquete-esc: #2a2005; --rec: #ff5a4f; --ok: #5fd39a;
    --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif; --corpo: "Inter", system-ui, -apple-system, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--texto); font: 15px/1.55 var(--corpo); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 40px; }
  .app { max-width: 1180px; margin: 0 auto; display: grid; gap: 18px; }
  header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .logo { width: 46px; height: 46px; border-radius: 10px; background: repeating-linear-gradient(135deg, var(--claquete) 0 10px, #15161d 10px 20px); flex: none; border: 2px solid var(--claquete); }
  h1 { font: 800 clamp(28px, 4.4vw, 42px)/1 var(--display); margin: 0; letter-spacing: -0.5px; text-wrap: balance; }
  header p { margin: 2px 0 0; color: var(--suave); }
  .grade { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 18px; align-items: start; }
  @media (max-width: 860px) { .grade { grid-template-columns: minmax(0, 1fr); } }
  .caixa { background: var(--painel); border: 1px solid var(--linha); border-radius: 14px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
  label.rot { font: 600 12px var(--corpo); text-transform: uppercase; letter-spacing: 1.2px; color: var(--suave); }
  textarea { width: 100%; min-height: 108px; resize: vertical; background: var(--painel2); color: var(--texto); border: 1px solid var(--linha); border-radius: 10px; padding: 12px; font: 16px/1.45 var(--corpo); }
  textarea:focus, select:focus, button:focus-visible { outline: 2px solid var(--claquete); outline-offset: 2px; }
  .ideias { display: flex; flex-wrap: wrap; gap: 6px; }
  .ideias button { background: var(--painel2); color: var(--texto); border: 1px solid var(--linha); border-radius: 999px; padding: 6px 11px; font: 500 13px var(--corpo); cursor: pointer; }
  .ideias button:hover { border-color: var(--claquete); }
  .linha { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  select { background: var(--painel2); color: var(--texto); border: 1px solid var(--linha); border-radius: 8px; padding: 8px 10px; font: 500 14px var(--corpo); }
  .bt { border: none; border-radius: 10px; padding: 12px 18px; font: 700 16px var(--display); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
  .bt.principal { background: var(--claquete); color: var(--claquete-esc); width: 100%; justify-content: center; font-size: 19px; }
  .bt.sec { background: var(--painel2); color: var(--texto); border: 1px solid var(--linha); }
  .bt.rec { background: var(--rec); color: #fff; }
  .bt:disabled { opacity: .45; cursor: default; }
  .estado { font-size: 14px; color: var(--suave); min-height: 1.4em; }
  .estado.ok { color: var(--ok); } .estado.erro { color: var(--rec); }
  .tela { position: relative; width: 100%; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 12px; overflow: hidden; background: #000; border: 1px solid var(--linha); }
  canvas { width: 100%; height: 100%; display: block; }
  .rec-sel { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,.6); color: #fff; font: 700 12px var(--corpo); letter-spacing: 1px; padding: 4px 9px; border-radius: 6px; }
  .rec-sel::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--rec); margin-right: 6px; vertical-align: 1px; }
  .barra { height: 5px; background: var(--painel2); border-radius: 3px; overflow: hidden; } .barra i { display: block; height: 100%; width: 0; background: var(--claquete); }
  .cenas { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
  .cena { background: var(--painel2); border: 1px solid var(--linha); border-radius: 10px; padding: 10px; font-size: 13px; color: var(--suave); min-width: 0; }
  .cena b { display: block; font: 700 13px var(--display); color: var(--claquete); margin-bottom: 3px; letter-spacing: .5px; }
  .cena .emo { font-size: 22px; line-height: 1.2; color: var(--texto); }
  .nota { font-size: 13px; color: var(--suave); }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>

<div class="app">
  <header>
    <div class="logo" aria-hidden="true"></div>
    <div><h1>Fábrica de Vídeos</h1><p>Escreva o vídeo que você quer. A fábrica inventa a história, anima as cenas e narra.</p></div>
  </header>

  <div class="grade">
    <form class="caixa" id="form" autocomplete="off">
      <label class="rot" for="pedido">Quero um vídeo de…</label>
      <textarea id="pedido" maxlength="400">um dinossauro que vira astronauta e viaja até a lua</textarea>
      <div class="ideias" aria-label="Ideias de vídeo">
        <button type="button" data-ideia="um gato que vira super-herói e salva a cidade">🐱 gato super-herói</button>
        <button type="button" data-ideia="uma corrida de carros na estrada até a praia">🏎️ corrida até a praia</button>
        <button type="button" data-ideia="um robô que aprende a dançar numa festa">🤖 robô dançarino</button>
        <button type="button" data-ideia="um peixinho perdido no fundo do mar procurando a família">🐠 peixinho perdido</button>
        <button type="button" data-ideia="um dragão amigo que mora num castelo na neve">🐉 dragão na neve</button>
      </div>
      <div class="linha">
        <label class="rot" for="tam">Tamanho</label>
        <select id="tam"><option value="4">Curto · 4 cenas</option><option value="6" selected>Médio · 6 cenas</option><option value="8">Longo · 8 cenas</option></select>
        <label class="rot" for="voz">Narração</label>
        <select id="voz"><option value="1" selected>Com voz</option><option value="0">Sem voz</option></select>
      </div>
      <button class="bt principal" id="b-criar" type="submit">🎬 Criar vídeo</button>
      <div class="estado" id="estado" role="status"></div>
      <p class="nota" id="nota-ia">No claude.ai a história é escrita pela inteligência do Claude. Fora dele, a fábrica monta uma história sozinha com as palavras do seu pedido.</p>
    </form>

    <section class="caixa" aria-label="Vídeo">
      <div class="tela"><canvas id="cv" width="1280" height="720" aria-label="Vídeo animado"></canvas><span class="rec-sel" id="rec-sel" hidden>GRAVANDO</span></div>
      <div class="barra" aria-hidden="true"><i id="progresso"></i></div>
      <div class="linha">
        <button class="bt sec" id="b-ver" type="button">▶ Assistir</button>
        <button class="bt sec" id="b-parar" type="button" disabled>■ Parar</button>
        <button class="bt rec" id="b-baixar" type="button">⬇ Baixar vídeo</button>
        <span class="nota" id="nota-baixar"></span>
      </div>
      <label class="rot">Cenas do roteiro</label>
      <div class="cenas" id="cenas"></div>
    </section>
  </div>
</div>

<script>
(() => {
const $ = id => document.getElementById(id);
const cv = $('cv'), g = cv.getContext('2d'), W = 1280, H = 720;
let sample = null, tts = null, downloads = null;
try { if (window.claude && claude.use) {
  claude.use('sample').then(s => { sample = s; }).catch(() => {});
  claude.use('tts').then(t => { tts = t; }).catch(() => {});
  claude.use('downloads').then(d => { downloads = d; atualizarBaixar(); }).catch(() => {});
} } catch (e) {}

// ===================== CENÁRIOS =====================
const FUNDOS = {
  ceu:        { ceu: ['#5fb4ff', '#c8e8ff'], chao: '#5cb85c', astro: 'sol', camadas: ['morros'] },
  cidade:     { ceu: ['#7ec3ff', '#e0f1ff'], chao: '#6b6f78', astro: 'sol', camadas: ['predios', 'predios2'] },
  floresta:   { ceu: ['#8fd3ff', '#e6f7e0'], chao: '#3e8e41', astro: 'sol', camadas: ['morros', 'arvores'] },
  espaco:     { ceu: ['#04061a', '#1a1450'], chao: '#9a9aa8', astro: 'planeta', camadas: ['crateras'], estrelas: true },
  lua:        { ceu: ['#02030f', '#121236'], chao: '#c9c9d2', astro: 'terra', camadas: ['crateras'], estrelas: true },
  mar:        { ceu: ['#6cc4ff', '#d6f2ff'], chao: '#1f7fc4', astro: 'sol', camadas: ['ondas'] },
  fundo_do_mar: { ceu: ['#0b5fa0', '#05233f'], chao: '#d9c38c', astro: 'luz', camadas: ['algas'], bolhas: true },
  praia:      { ceu: ['#5ab8ff', '#fff1c9'], chao: '#f2d38a', astro: 'sol', camadas: ['marPraia', 'coqueiros'] },
  deserto:    { ceu: ['#ffb45a', '#ffe7b0'], chao: '#e8b864', astro: 'sol', camadas: ['dunas', 'cactos'] },
  neve:       { ceu: ['#b9d7ee', '#f4f8ff'], chao: '#f5f8ff', astro: 'sol', camadas: ['montanhas', 'pinheiros'] },
  montanha:   { ceu: ['#86c5ff', '#eaf5ff'], chao: '#6aa84f', astro: 'sol', camadas: ['montanhas'] },
  noite:      { ceu: ['#0a1030', '#2a2a6a'], chao: '#1d3a2a', astro: 'lua', camadas: ['morros', 'casasLuz'], estrelas: true },
  castelo:    { ceu: ['#9ac8ff', '#f6e9ff'], chao: '#5a9e4b', astro: 'sol', camadas: ['morros', 'castelo'] },
  estrada:    { ceu: ['#7cc4ff', '#e8f6ff'], chao: '#59a34a', astro: 'sol', camadas: ['morros', 'estrada'] },
  vulcao:     { ceu: ['#3a0f0f', '#ff7a2a'], chao: '#3b2a24', astro: 'nenhum', camadas: ['vulcao'] },
  festa:      { ceu: ['#2a0f4a', '#7a2a8a'], chao: '#3a2a5a', astro: 'globo', camadas: ['palco'], estrelas: true },
  escola:     { ceu: ['#8cc8ff', '#eaf6ff'], chao: '#69b04f', astro: 'sol', camadas: ['escola'] },
  casa:       { ceu: ['#ffe2b8', '#fff6e8'], chao: '#b07a4a', astro: 'nenhum', camadas: ['sala'] },
};
const ACOES = ['parado', 'andar', 'correr', 'pular', 'voar', 'girar', 'dancar', 'falar', 'nadar'];
const EFEITOS = ['nenhum', 'chuva', 'neve', 'estrelas', 'confete', 'brilho', 'fogo', 'bolhas', 'coracoes'];

function rnd(seed) { let s = seed | 0; return () => { s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function desenharFundo(f, t, k) {
  const F = FUNDOS[f] || FUNDOS.ceu, chaoY = 560;
  const gr = g.createLinearGradient(0, 0, 0, chaoY); gr.addColorStop(0, F.ceu[0]); gr.addColorStop(1, F.ceu[1]); g.fillStyle = gr; g.fillRect(0, 0, W, H);
  if (F.estrelas) { const R = rnd(7); for (let i = 0; i < 140; i++) { const a = 0.4 + 0.6 * Math.abs(Math.sin(t * 2 + i)); g.fillStyle = `rgba(255,255,255,${a})`; g.fillRect(R() * W, R() * chaoY * 0.9, 2.2, 2.2); } }
  const ax = 1040 - k * 40, ay = 130;
  if (F.astro === 'sol') { const s = g.createRadialGradient(ax, ay, 10, ax, ay, 120); s.addColorStop(0, 'rgba(255,248,200,1)'); s.addColorStop(0.35, 'rgba(255,220,110,.9)'); s.addColorStop(1, 'rgba(255,220,110,0)'); g.fillStyle = s; g.beginPath(); g.arc(ax, ay, 120, 0, 7); g.fill(); }
  if (F.astro === 'lua') { g.fillStyle = '#f4f1d8'; g.beginPath(); g.arc(ax, ay, 46, 0, 7); g.fill(); g.fillStyle = F.ceu[0]; g.beginPath(); g.arc(ax + 20, ay - 10, 42, 0, 7); g.fill(); }
  if (F.astro === 'planeta') { g.fillStyle = '#e07a3a'; g.beginPath(); g.arc(ax, ay + 20, 70, 0, 7); g.fill(); g.strokeStyle = 'rgba(255,220,160,.8)'; g.lineWidth = 8; g.beginPath(); g.ellipse(ax, ay + 20, 120, 26, -0.3, 0, 7); g.stroke(); }
  if (F.astro === 'terra') { const e = g.createRadialGradient(ax - 15, ay - 15, 10, ax, ay, 60); e.addColorStop(0, '#7ad0ff'); e.addColorStop(1, '#1a5aa8'); g.fillStyle = e; g.beginPath(); g.arc(ax, ay, 60, 0, 7); g.fill(); g.fillStyle = '#4caf50'; g.beginPath(); g.ellipse(ax - 12, ay - 8, 22, 14, 0.4, 0, 7); g.fill(); g.beginPath(); g.ellipse(ax + 20, ay + 18, 14, 9, -0.3, 0, 7); g.fill(); }
  if (F.astro === 'luz') { for (let i = 0; i < 5; i++) { g.fillStyle = 'rgba(180,230,255,.08)'; g.beginPath(); g.moveTo(200 + i * 220 + Math.sin(t + i) * 30, 0); g.lineTo(260 + i * 220, 0); g.lineTo(140 + i * 240, chaoY); g.lineTo(60 + i * 240, chaoY); g.fill(); } }
  if (F.astro === 'globo') { for (let i = 0; i < 6; i++) { const a = t * 1.5 + i; g.fillStyle = `hsla(${(i * 60 + t * 80) % 360},90%,60%,.25)`; g.beginPath(); g.moveTo(640, 40); g.lineTo(640 + Math.cos(a) * 700, chaoY); g.lineTo(640 + Math.cos(a + 0.15) * 700, chaoY); g.fill(); } g.fillStyle = '#cfd6e6'; g.beginPath(); g.arc(640, 60, 26, 0, 7); g.fill(); }
  const par = (n) => -k * 60 * n;
  for (const c of F.camadas) camada(c, t, par, chaoY);
  g.fillStyle = F.chao; g.fillRect(0, chaoY, W, H - chaoY);
  const ch = g.createLinearGradient(0, chaoY, 0, H); ch.addColorStop(0, 'rgba(0,0,0,0)'); ch.addColorStop(1, 'rgba(0,0,0,.25)'); g.fillStyle = ch; g.fillRect(0, chaoY, W, H - chaoY);
  if (F.bolhas) { for (let i = 0; i < 25; i++) { const y = (H - ((t * 60 + i * 97) % H)); g.strokeStyle = 'rgba(220,245,255,.5)'; g.lineWidth = 2; g.beginPath(); g.arc((i * 157) % W + Math.sin(t + i) * 10, y, 4 + (i % 4) * 2, 0, 7); g.stroke(); } }
}
function camada(c, t, par, chaoY) {
  const R = rnd(c.length * 31);
  const morro = (cor, alt, ox, n) => { g.fillStyle = cor; g.beginPath(); g.moveTo(-50, chaoY); for (let x = -50; x <= W + 50; x += 20) g.lineTo(x, chaoY - alt - Math.sin((x + ox) / n) * alt * 0.5 - Math.sin((x + ox) / (n * 0.37)) * alt * 0.2); g.lineTo(W + 50, chaoY); g.fill(); };
  if (c === 'morros') { morro('rgba(80,150,90,.55)', 110, par(0.3), 210); morro('rgba(60,130,70,.8)', 60, par(0.6) + 300, 150); }
  if (c === 'montanhas') { g.fillStyle = '#8796ad'; g.beginPath(); g.moveTo(-50, chaoY); for (let i = 0; i < 7; i++) { const x = i * 230 + par(0.3) % 230; g.lineTo(x + 115, chaoY - 230 - (i % 2) * 70); g.lineTo(x + 230, chaoY); } g.fill(); g.fillStyle = '#ffffff'; for (let i = 0; i < 7; i++) { const x = i * 230 + par(0.3) % 230, top = chaoY - 230 - (i % 2) * 70; g.beginPath(); g.moveTo(x + 115, top); g.lineTo(x + 75, top + 60); g.lineTo(x + 155, top + 60); g.fill(); } }
  if (c === 'predios' || c === 'predios2') { const longe = c === 'predios', off = par(longe ? 0.25 : 0.6); for (let i = -1; i < 16; i++) { const w = 70 + R() * 70, h = (longe ? 160 : 90) + R() * (longe ? 220 : 150), x = i * 95 + (off % 95); g.fillStyle = longe ? '#8fa1b8' : '#55627a'; g.fillRect(x, chaoY - h, w, h); g.fillStyle = longe ? 'rgba(255,255,255,.35)' : 'rgba(255,240,180,.7)'; for (let yy = chaoY - h + 14; yy < chaoY - 20; yy += 26) for (let xx = x + 10; xx < x + w - 14; xx += 22) if (R() > 0.35) g.fillRect(xx, yy, 10, 14); } }
  if (c === 'arvores' || c === 'pinheiros' || c === 'coqueiros' || c === 'cactos') { const off = par(0.7); for (let i = -1; i < 12; i++) { const x = i * 125 + (off % 125) + R() * 40, s = 0.8 + R() * 0.5; arvore(c, x, chaoY + 4, s); } }
  if (c === 'ondas' || c === 'marPraia') { const y0 = c === 'marPraia' ? chaoY - 70 : chaoY - 40; g.fillStyle = '#2b8fd6'; g.fillRect(0, y0, W, chaoY - y0); g.strokeStyle = 'rgba(255,255,255,.7)'; g.lineWidth = 4; for (let r = 0; r < 3; r++) { g.beginPath(); for (let x = 0; x <= W; x += 10) g.lineTo(x, y0 + 12 + r * 18 + Math.sin(x / 40 + t * 2 + r) * 5); g.stroke(); } }
  if (c === 'dunas') { morro('#f0c070', 90, par(0.3), 260); morro('#e2a850', 45, par(0.6) + 200, 180); }
  if (c === 'crateras') { for (let i = 0; i < 8; i++) { const x = (i * 170 + par(0.5)) % (W + 200) - 100; g.fillStyle = 'rgba(80,80,100,.35)'; g.beginPath(); g.ellipse(x, chaoY + 40 + (i % 3) * 40, 60, 14, 0, 0, 7); g.fill(); } }
  if (c === 'algas') { for (let i = 0; i < 18; i++) { const x = i * 75 + par(0.5) % 75; g.strokeStyle = i % 2 ? '#2f9e5a' : '#3fbf6a'; g.lineWidth = 9; g.beginPath(); g.moveTo(x, chaoY + 10); for (let y = 0; y < 7; y++) g.lineTo(x + Math.sin(t * 2 + y + i) * 12, chaoY - y * 26); g.stroke(); } }
  if (c === 'casasLuz') { for (let i = 0; i < 6; i++) { const x = i * 230 + 40 + par(0.5) % 230; g.fillStyle = '#152238'; g.fillRect(x, chaoY - 90, 120, 90); g.beginPath(); g.moveTo(x - 10, chaoY - 90); g.lineTo(x + 60, chaoY - 140); g.lineTo(x + 130, chaoY - 90); g.fill(); g.fillStyle = '#ffd56a'; g.fillRect(x + 20, chaoY - 66, 26, 24); g.fillRect(x + 74, chaoY - 66, 26, 24); } }
  if (c === 'castelo') { const x = 760 + par(0.3); g.fillStyle = '#b9b2c8'; g.fillRect(x, chaoY - 220, 280, 220); for (const tx of [x - 30, x + 250]) { g.fillRect(tx, chaoY - 300, 60, 300); g.fillStyle = '#d0485a'; g.beginPath(); g.moveTo(tx - 8, chaoY - 300); g.lineTo(tx + 30, chaoY - 370); g.lineTo(tx + 68, chaoY - 300); g.fill(); g.fillStyle = '#b9b2c8'; } g.fillStyle = '#5a4a3a'; g.beginPath(); g.arc(x + 140, chaoY - 40, 40, Math.PI, 0); g.fill(); g.fillRect(x + 100, chaoY - 40, 80, 40); }
  if (c === 'estrada') { g.fillStyle = '#4a4d55'; g.fillRect(0, chaoY + 30, W, 90); g.fillStyle = '#ffe066'; for (let x = -((t * 400) % 120); x < W; x += 120) g.fillRect(x, chaoY + 72, 60, 8); }
  if (c === 'vulcao') { g.fillStyle = '#4a2f28'; g.beginPath(); g.moveTo(300, chaoY); g.lineTo(560, chaoY - 300); g.lineTo(720, chaoY - 300); g.lineTo(980, chaoY); g.fill(); g.fillStyle = '#ff5a1a'; g.beginPath(); g.ellipse(640, chaoY - 300, 80, 16, 0, 0, 7); g.fill(); for (let i = 0; i < 12; i++) { const a = (t * 1.2 + i * 0.4) % 2; g.fillStyle = `rgba(255,${120 + i * 8},30,${1 - a / 2})`; g.beginPath(); g.arc(640 + Math.sin(i * 7) * a * 90, chaoY - 300 - a * 160 + a * a * 40, 9 - a * 3, 0, 7); g.fill(); } }
  if (c === 'palco') { g.fillStyle = '#1a0f2a'; g.fillRect(0, chaoY - 40, W, 40); for (let i = 0; i < 10; i++) { g.fillStyle = `hsl(${(i * 36 + t * 120) % 360},90%,60%)`; g.beginPath(); g.arc(80 + i * 125, chaoY - 20, 8, 0, 7); g.fill(); } }
  if (c === 'escola') { const x = 760 + par(0.3); g.fillStyle = '#e8a25a'; g.fillRect(x, chaoY - 200, 320, 200); g.fillStyle = '#c0392b'; g.beginPath(); g.moveTo(x - 20, chaoY - 200); g.lineTo(x + 160, chaoY - 280); g.lineTo(x + 340, chaoY - 200); g.fill(); g.fillStyle = '#bfe4ff'; for (let i = 0; i < 4; i++) g.fillRect(x + 25 + i * 75, chaoY - 160, 45, 45); g.fillStyle = '#6b4a2a'; g.fillRect(x + 135, chaoY - 80, 50, 80); }
  if (c === 'sala') { g.fillStyle = '#f2d7b0'; g.fillRect(0, 0, W, chaoY); g.fillStyle = '#9ad0ff'; g.fillRect(140, 120, 260, 180); g.strokeStyle = '#fff'; g.lineWidth = 10; g.strokeRect(140, 120, 260, 180); g.fillStyle = '#c06a4a'; g.fillRect(760, chaoY - 120, 360, 90); g.fillRect(760, chaoY - 170, 360, 60); }
}

  if (tts) { tts.speak(txt, { language: 'pt-BR', voice: 'buttery' }).catch(() => {}); return; }
  try { if (!window.speechSynthesis) return; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(txt); u.lang = 'pt-BR'; u.rate = 1.0; const v = speechSynthesis.getVoices().find(v => /pt[-_]BR/i.test(v.lang)); if (v) u.voice = v; speechSynthesis.speak(u); } catch (e) {} }
function calarVoz() { try { tts && tts.stop(); } catch (e) {} try { window.speechSynthesis && speechSynthesis.cancel(); } catch (e) {} }

// ===================== TOCAR E GRAVAR =====================
let tocando = null;
function tocar({ gravar = false } = {}) {
  parar(); const total = duracaoTotal(); let inicio = performance.now(), ultimaCena = -1, pararMusica, rec = null, partes = [], mime = '';
  const dests = []; AC = AC || new (window.AudioContext || window.webkitAudioContext)(); dests.push(AC.destination);
  if (gravar) { const sd = AC.createMediaStreamDestination(); dests.push(sd);
    const tipos = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm']; mime = tipos.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
    if (!mime) { status('Este navegador não consegue gravar vídeo. Tente no Chrome ou no Edge.', 'erro'); return; }
    const stream = new MediaStream([...cv.captureStream(30).getVideoTracks(), ...sd.stream.getAudioTracks()]);
    rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 5_000_000 }); rec.ondataavailable = e => { if (e.data && e.data.size) partes.push(e.data); }; rec.start(250); $('rec-sel').hidden = false; }
  pararMusica = iniciarMusica(dests);
  const passo = () => { const T = (performance.now() - inicio) / 1000; quadro(Math.min(T, total)); $('progresso').style.width = (Math.min(1, T / total) * 100) + '%';
    let t = T - 2.5, ci = -1; for (let i = 0; i < roteiro.cenas.length && t >= 0; i++) { if (t < roteiro.cenas[i].dur) { ci = i; break; } t -= roteiro.cenas[i].dur; }
    if (ci !== ultimaCena && ci >= 0) { ultimaCena = ci; falar(roteiro.cenas[ci].narracao); }
    if (T >= total) { terminar(true); return; } tocando.raf = requestAnimationFrame(passo); };
  const terminar = (completo) => { cancelAnimationFrame(tocando && tocando.raf); pararMusica && pararMusica(); calarVoz(); $('rec-sel').hidden = true; $('b-parar').disabled = true; $('b-ver').disabled = false; $('b-baixar').disabled = !downloads; const r = rec; tocando = null;
    if (r) { r.onstop = () => { if (completo) salvarVideo(new Blob(partes, { type: mime.split(';')[0] }), mime); else status('Gravação cancelada.', ''); }; r.stop(); } };
  tocando = { raf: 0, terminar }; $('b-parar').disabled = false; $('b-ver').disabled = true; $('b-baixar').disabled = true; tocando.raf = requestAnimationFrame(passo);
  if (gravar) status('Gravando o vídeo… espere ele terminar de passar.', '');
}
function parar() { if (tocando) tocando.terminar(false); }
async function salvarVideo(blob, mime) { const ext = mime.includes('mp4') ? 'mp4' : 'webm', nome = (roteiro.titulo || 'video').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-|-$/g, '').toLowerCase() || 'video';
  if (!downloads) { status('Para baixar, abra a Fábrica de Vídeos no claude.ai.', 'erro'); return; }
  try { await downloads.save({ filename: `${nome}.${ext}`, data: blob }); status(`Vídeo salvo: ${nome}.${ext} (${(blob.size / 1048576).toFixed(1)} MB).`, 'ok'); }
  catch (e) { status(e && e.code === 'declined' ? 'Você cancelou o download.' : 'Não deu para salvar o vídeo aqui.', 'erro'); } }
function atualizarBaixar() { $('b-baixar').disabled = !downloads || !!tocando; $('nota-baixar').textContent = downloads ? 'O vídeo baixado leva as cenas, as legendas e a música.' : 'Baixar funciona quando a página está aberta no claude.ai.'; }
function status(txt, tipo) { const e = $('estado'); e.textContent = txt; e.className = 'estado' + (tipo ? ' ' + tipo : ''); }

// ===================== CRIAR =====================
$('form').addEventListener('submit', async ev => { ev.preventDefault(); const pedido = $('pedido').value.trim(), n = +$('tam').value; if (!pedido) { status('Escreva qual vídeo você quer.', 'erro'); return; }
  parar(); $('b-criar').disabled = true; status('Escrevendo a história…', '');
  try { let r = null;
    if (sample) { try { r = await sample.json(`${INSTRUCOES}\n\nNúmero de cenas: ${n}.\nPedido: ${pedido}`, { modelTier: 'default' }); } catch (e) { if (e && e.code === 'not_granted') sample = null; r = null; } }
    roteiro = validar(r || roteiroLocal(pedido, n)); mostrarCenas(); quadro(0.2); status(`Pronto! "${roteiro.titulo}" tem ${roteiro.cenas.length} cenas e ${Math.round(duracaoTotal())} segundos. Aperte Assistir.`, 'ok');
  } catch (e) { roteiro = validar(roteiroLocal(pedido, n)); mostrarCenas(); quadro(0.2); status('Montei uma história com as palavras do seu pedido.', 'ok'); }
  $('b-criar').disabled = false; });
document.querySelectorAll('[data-ideia]').forEach(b => b.addEventListener('click', () => { $('pedido').value = b.dataset.ideia; $('pedido').focus(); }));
$('b-ver').addEventListener('click', () => tocar());
$('b-parar').addEventListener('click', parar);
$('b-baixar').addEventListener('click', () => tocar({ gravar: true }));

roteiro = validar(JSON.parse(JSON.stringify(EXEMPLO))); mostrarCenas(); quadro(6); atualizarBaixar();
status('Exemplo pronto: aperte Assistir, ou escreva o seu pedido e crie um vídeo novo.', '');
})();
</script>
